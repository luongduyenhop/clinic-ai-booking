name: Clinic AI Booking - Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop", "fix/**", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-quality-and-test:
    name: Linting & Automated Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clinic_db
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: clinic_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Cài đặt Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 4. Kiểm tra Linter & Cú pháp (Ruff)
        run: |
          python -m ruff check .

      - name: 5. Chạy Toàn Bộ Bộ Kiểm Thử Tự Động (Pytest)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://clinic_user:clinic_password@localhost:5432/clinic_db
          SECRET_KEY: test_secret_key_ci_pipeline_2026
          DEBUG: "True"
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          fi
