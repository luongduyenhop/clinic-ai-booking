name: Clinic AI Booking - Monorepo CI Pipeline

on:
  push:
    branches: [ "main", "develop", "fix/**", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-quality-and-test:
    name: Backend Linting & Automated Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clinic_ci_test_db
          POSTGRES_USER: clinic_ci_user
          POSTGRES_PASSWORD: clinic_ci_test_password_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_ci_user -d clinic_ci_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: 3. Cài đặt Dependencies Backend
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 4. Kiểm tra Linter & Cú pháp (Ruff)
        working-directory: ./backend
        run: |
          python -m ruff check --fix .
          python -m ruff check .

      - name: 5. Thực Thi Di Chuyển Lược Đồ CSDL Độc Lập (Alembic Migration Runner)
        working-directory: ./backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://clinic_ci_user:clinic_ci_test_password_2026@localhost:5432/clinic_ci_test_db
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: clinic_ci_user
          POSTGRES_PASSWORD: clinic_ci_test_password_2026
          POSTGRES_DB: clinic_ci_test_db
          SECRET_KEY: test_secret_key_ci_pipeline_2026_at_least_32_chars
          PAYMENT_WEBHOOK_SECRET: test_payment_webhook_secret_key_32bytes
          ENVIRONMENT: test
          DEBUG: "False"
        run: |
          python scripts/run_migrations.py --target-revision head
          alembic upgrade head
          alembic current

      - name: 6. Chạy Toàn Bộ Bộ Kiểm Thử Tự Động (Pytest)
        working-directory: ./backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://clinic_ci_user:clinic_ci_test_password_2026@localhost:5432/clinic_ci_test_db
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: clinic_ci_user
          POSTGRES_PASSWORD: clinic_ci_test_password_2026
          POSTGRES_DB: clinic_ci_test_db
          SECRET_KEY: test_secret_key_ci_pipeline_2026_at_least_32_chars
          PAYMENT_WEBHOOK_SECRET: test_payment_webhook_secret_key_32bytes
          ENVIRONMENT: test
          DEBUG: "False"
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          fi

  frontend-quality-and-build:
    name: Frontend Linting & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "fe/package-lock.json"

      - name: 3. Cài đặt Dependencies Frontend
        working-directory: ./fe
        run: |
          npm ci

      - name: 4. Kiểm tra Linter Frontend (Oxlint)
        working-directory: ./fe
        run: |
          npm run lint

      - name: 5. Chạy Toàn Bộ Bộ Kiểm Thử Tự Động (Node Test Runner)
        working-directory: ./fe
        run: |
          npm test

      - name: 6. Build Production (Vite)
        working-directory: ./fe
        env:
          VITE_API_URL: http://localhost:8000
          VITE_USE_MOCK: "false"
        run: |
          npm run build
