name: Clinic AI Booking - Monorepo CI Pipeline

on:
  push:
    branches: [ "main", "develop", "fix/**", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-quality-and-test:
    name: Backend Linting & Automated Testing
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: clinic_db
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: clinic_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: 3. Cài đặt Dependencies Backend
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 4. Kiểm tra Linter & Cú pháp (Ruff)
        working-directory: ./backend
        run: |
          python -m ruff check --fix .
          python -m ruff check .

      - name: 5. Chạy Toàn Bộ Bộ Kiểm Thử Tự Động (Pytest)
        working-directory: ./backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://clinic_user:clinic_password@localhost:5432/clinic_db
          SECRET_KEY: test_secret_key_ci_pipeline_2026
          DEBUG: "True"
        run: |
          if [ -d tests ]; then
            python -m pytest tests -v
          fi

  frontend-quality-and-build:
    name: Frontend Linting & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt môi trường Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "fe/package-lock.json"

      - name: 3. Cài đặt Dependencies Frontend
        working-directory: ./fe
        run: |
          npm ci

      - name: 4. Kiểm tra Linter & Build Production (Vite)
        working-directory: ./fe
        env:
          VITE_API_URL: http://localhost:8000
          VITE_USE_MOCK: "false"
        run: |
          npm run build
