name: Deploy to Production VPS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  test-and-build:
    name: Build Frontend & Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - name: Install Frontend Dependencies & Build
        working-directory: ./fe
        run: |
          npm ci
          npm run build

      - name: Package Frontend Bundle
        run: |
          tar -czf fe-dist.tar.gz -C fe/dist .

      - name: Setup SSH Connection
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          KEY_SIZE=$(wc -c < ~/.ssh/id_rsa)
          KEY_CHECK=$(ssh-keygen -l -f ~/.ssh/id_rsa 2>&1 || echo "INVALID_KEY")
          echo "::notice::KEY_SIZE=$KEY_SIZE | KEY_CHECK=$KEY_CHECK"

      - name: Transfer Build & Code to VPS
        run: |
          SSH_HOST="${{ secrets.VPS_SSH_HOST }}"
          [ -z "$SSH_HOST" ] && SSH_HOST="3.27.138.183"
          SSH_USER="${{ secrets.VPS_SSH_USER }}"
          [ -z "$SSH_USER" ] && SSH_USER="ubuntu"
          if ! ssh -v -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "echo SSH_CONNECTED" > /tmp/ssh.log 2>&1; then
            ERR_MSG=$(tail -n 20 /tmp/ssh.log | tr '\n' ' ')
            echo "::error::SSH failed: $ERR_MSG"
            cat /tmp/ssh.log
            exit 1
          fi
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa fe-dist.tar.gz "$SSH_USER@$SSH_HOST:/home/ubuntu/clinic-ai/"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa -r backend/app "$SSH_USER@$SSH_HOST:/home/ubuntu/clinic-ai/backend/"

      - name: Update Containers and Verify Service Health
        run: |
          SSH_HOST="${{ secrets.VPS_SSH_HOST }}"
          [ -z "$SSH_HOST" ] && SSH_HOST="3.27.138.183"
          SSH_USER="${{ secrets.VPS_SSH_USER }}"
          [ -z "$SSH_USER" ] && SSH_USER="ubuntu"
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_rsa "$SSH_USER@$SSH_HOST" "bash /home/ubuntu/clinic-ai/deploy.sh"
