# alembic.ini - Cấu hình Alembic Migration cho Clinic AI Booking System
# Đây là "git config" cho database - khai báo kết nối và thư mục migration

[alembic]
# Thư mục chứa các migration script
script_location = alembic

# Định dạng tên file migration: ngày_giờ_tên_ngắn.py
# VD: 20261001_1430_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Alembic sẽ đọc DATABASE_URL từ env.py (không khai báo cứng ở đây vì có password)
# sqlalchemy.url =   <-- để trống, env.py tự lấy từ settings

[post_write_hooks]
# Tự động format code migration bằng Ruff sau khi autogenerate
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = --fix AUTOGENERATED_FILE

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
