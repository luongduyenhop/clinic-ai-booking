# Ruff configuration for Clinic AI Booking Backend
line-length = 120
target-version = "py311"

[lint]
# Check standard syntax, logic, and runtime errors
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
ignore = [
    "E501", # Line too long
    "E402", # Module level import not at top of file
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"app/models/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]
