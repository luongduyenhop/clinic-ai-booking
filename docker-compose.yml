x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-clinic-demo}-backend:demo
  build: ./backend
  security_opt:
    - no-new-privileges:true
  logging: &logging
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-backend-env: &backend-env
  ENVIRONMENT: demo
  DEBUG: "false"
  ENABLE_DEMO_SEED: "true"
  ENABLE_OUTBOUND_NOTIFICATIONS: "false"
  POSTGRES_SERVER: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-clinic_demo}
  POSTGRES_USER: ${POSTGRES_USER:-clinic_demo}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.demo}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.demo}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET in .env.demo}
  CLS_UPLOAD_DIR: /var/lib/clinic/cls

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic_demo}
      POSTGRES_USER: ${POSTGRES_USER:-clinic_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  bootstrap:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *backend-env
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env.demo}
    command:
      - /bin/sh
      - -ec
      - python -m scripts.run_migrations && python -m scripts.seed_demo
    networks:
      - data

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment: *backend-env
    volumes:
      - cls_uploads:/var/lib/clinic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - app
      - data

  frontend:
    build:
      context: ./fe
      args:
        VITE_DEMO_MODE: "true"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DEMO_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    logging: *logging
    networks:
      - app

volumes:
  postgres_data:
  cls_uploads:

networks:
  app:
  data:
    internal: true
