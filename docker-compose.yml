services:
  # 1. Database Tier: PostgreSQL 15
  db:
    image: postgres:15-alpine
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic_user
      POSTGRES_PASSWORD: clinic_password
      POSTGRES_DB: clinic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_user -d clinic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Application Tier: FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://clinic_user:clinic_password@db:5432/clinic_db
      - DEBUG=True
      - SECRET_KEY=super_secret_clinic_jwt_key_project_1_change_in_production_2026
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
