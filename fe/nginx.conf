log_format demo '$request_method $status $body_bytes_sent $request_time';

upstream clinic_api {
    zone clinic_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout demo;
    error_log /dev/stderr crit;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location = /healthz {
        access_log off;
        proxy_pass http://clinic_api/health;
    }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location = /api/v1/openapi.json {
        return 404;
    }

    location ^~ /api/ {
        client_max_body_size 11m;
        proxy_pass http://clinic_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
